[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "SuperGluePretrainedNetwork"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.1.3",
  "numpy>=1.18.1",
  "opencv-python>=4.1.2.30",
  "torch>=1.1.0",
]

# Put the repo-top-level `models/` into the installed wheel at
# SuperGluePretrainedNetwork/models (creating an implicit-namespace package).
[tool.hatch.build.targets.wheel]
packages = []  # disable auto-discovery
[tool.hatch.build.targets.wheel.force-include]
"models" = "SuperGluePretrainedNetwork/models"

# (optional) if you also want assets shipped inside the package:
# "assets" = "SuperGluePretrainedNetwork/assets"

# Make sure sdists carry the sources too
[tool.hatch.build.targets.sdist]
include = ["models", "assets", "README.md", "LICENSE", "pyproject.toml"]

